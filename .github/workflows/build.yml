name: Build Cash Opinion Console APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/app/console.keystore
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/console.keystore
            echo "Keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not found."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        id: gradle_build
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle_build.log

      - name: Determine Version and Create Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="2.0.0"
          if [ -f "version.properties" ]; then
            VERSION_NAME=$(grep 'versionName=' version.properties | cut -d'=' -f2)
          fi
          RELEASE_TAG="v${VERSION_NAME}-build-${{ github.run_number }}"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          TARGET_APK="CashOpinion-Console-${RELEASE_TAG}.apk"

          if [ ! -f "$RELEASE_APK" ]; then
            echo "Error: Release APK not found at $RELEASE_APK"
            exit 1
          fi

          cp "$RELEASE_APK" "$TARGET_APK"

          cat << 'EOF' > release_notes.md
          ### Cash Opinion Console Release
          - Production-ready admin app for Cash Opinion platform.
          - Secure multi-path transaction money management.
          - Built and signed automatically via GitHub Actions.
          EOF

          gh release create "$RELEASE_TAG" "$TARGET_APK" \
            --title "Cash Opinion Console $RELEASE_TAG" \
            --notes-file release_notes.md \
            --latest || gh release upload "$RELEASE_TAG" "$TARGET_APK" --clobber
